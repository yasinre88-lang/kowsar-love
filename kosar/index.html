<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دنیای صورتی کوثر ❤️</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<div class="background-hearts" id="backgroundHearts"></div>

<main class="main-card">

    <!-- صفحه اول -->
    <section id="welcome" class="screen active">
        <div class="big-heart">💗</div>

        <h1>سلام کوثر جونم!</h1>

        <p class="subtitle">
            یه دنیای کوچولو فقط برای تو ساختم 🌸
        </p>

        <button class="main-button" id="startButton">
            بیا داخل دنیای من ❤️
        </button>
    </section>

    <!-- صفحه پیام عاشقانه -->
    <section id="loveMessage" class="screen">
        <div class="big-heart">💖</div>

        <h1>کوثر جونم...</h1>

        <p class="love-text">
            کوثر جونم تو یکی از قشنگ‌ترین اتفاق‌های زندگی منی ❤️
        </p>

        <p class="subtitle">
            این دنیا فقط برای تو ساخته شده 🌷
        </p>

        <button class="main-button" id="nextButton">
            یه سؤال ازت دارم 💕
        </button>
    </section>

    <!-- صفحه سؤال -->
    <section id="questionPage" class="screen">
        <div class="big-heart">💗</div>

        <h1>کوثر عزیزم!</h1>

        <p class="question-text" id="question">
            تو هم منو به اندازه من دوست داری؟ 💕
        </p>

        <div class="buttons" id="buttons">
            <button class="yes-button" id="yes">
                آرههههه ❤️
            </button>

            <button class="no-button" id="no">
                نه 🙈
            </button>
        </div>
    </section>

    <!-- صفحه پایانی -->
    <section id="finalPage" class="screen">
        <div class="big-heart">💝</div>

        <h1>می‌دونستم کوثر! </h1>

        <p class="love-text">
            تو قشنگ‌ترین اتفاق زندگی منی ❤️
        </p>

        <p class="subtitle">
            دوستت دارم، کوثر جونم 💗
        </p>
    </section>

</main>

</body>
</html>
